[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-contributions"
version = "0.3.0"
description = "Independent replay of the tests attached to a pull request"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "PyYAML>=6"]

[project.scripts]
vrc = "vrc.cli:main"

[tool.setuptools.packages.find]
include = ["vrc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set so a developer's global ruff config cannot make CI disagree
# with a local run.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
