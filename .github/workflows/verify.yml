name: verify

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep this job named exactly `verify`: the main ruleset requires a status
# check with that name. A matrix would rename it to "verify (pyX.Y)" and block
# every merge. Cross-version coverage lives in the separate compat workflow.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check ruff pytest PyYAML
      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .
      - name: Test
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "no tests yet"; fi
