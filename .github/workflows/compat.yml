name: compat

# Cross-version coverage. Deliberately a separate workflow: the `main`
# ruleset requires a status check literally named `verify`, and a matrix on
# that job would rename its checks to "verify (pyX.Y)" and block all merges.

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    name: compat (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check ruff pytest PyYAML
      - name: Test
        run: python -m pytest -q

  contracts:
    runs-on: ubuntu-latest
    name: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Documentation and release contracts
        run: python -m pytest -q tests/test_policy_contract.py tests/test_release_contract.py tests/test_docs_contract.py tests/test_no_false_positive.py
