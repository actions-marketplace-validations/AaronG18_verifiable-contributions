name: "Verifiable Contributions"
description: "Replay PR tests on base and head, then emit a tamper-evident verification receipt."
author: "AaronG18"

branding:
  icon: "shield"
  color: "purple"

inputs:
  base:
    description: "Base commit SHA (before the change)"
    required: true
  head:
    description: "Head commit SHA (with the change)"
    required: true
  python-version:
    description: "Python version used to run the verifier"
    required: false
    default: "3.12"
  setup-command:
    description: "Shell command that installs the project's test dependencies before replay"
    required: false
    default: "python -m pip install --disable-pip-version-check pytest"
  fail-on:
    description: "Comma-separated verdicts that should fail the step; empty means report only"
    required: false
    default: ""
  repository:
    description: "Repository identifier recorded in the receipt"
    required: false
    default: ""

outputs:
  verdict:
    description: "VERIFIED, NEEDS_EVIDENCE, NEEDS_RERUN or UNTRUSTED"
    value: ${{ steps.replay.outputs.verdict }}
  receipt:
    description: "Path to the generated receipt JSON"
    value: ${{ steps.replay.outputs.receipt }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the verifier from this action
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$ACTION_PATH"

    - name: Install the project's test dependencies
      if: inputs.setup-command != ''
      shell: bash
      env:
        SETUP_COMMAND: ${{ inputs.setup-command }}
      run: bash -c "$SETUP_COMMAND"

    - name: Replay tests on base and head
      id: replay
      shell: bash
      env:
        VRC_BASE: ${{ inputs.base }}
        VRC_HEAD: ${{ inputs.head }}
        VRC_FAIL_ON: ${{ inputs.fail-on }}
        VRC_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        args=(replay --base "$VRC_BASE" --head "$VRC_HEAD" --output receipt.json --format summary)
        if [[ -n "$VRC_REPOSITORY" ]]; then
          args+=(--repository "$VRC_REPOSITORY")
        fi
        if [[ -n "$VRC_FAIL_ON" ]]; then
          args+=(--fail-on "$VRC_FAIL_ON")
        fi
        set +e
        vrc "${args[@]}"
        status=$?
        set -e
        if [[ ! -f receipt.json ]]; then
          echo "::error::verifier did not produce a receipt"
          exit 1
        fi
        verdict="$(python -c 'import json; print(json.load(open("receipt.json"))["verdict"])')"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "receipt=receipt.json" >> "$GITHUB_OUTPUT"
        # Self-validate before publishing: a receipt that fails its own
        # integrity check must never reach the job summary or the artifact.
        if ! vrc check receipt.json; then
          echo "::error::receipt failed its own integrity check"
          exit 1
        fi
        vrc explain receipt.json >> "$GITHUB_STEP_SUMMARY" || true
        exit "$status"

    - name: Upload receipt
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: verification-receipt
        path: receipt.json
        if-no-files-found: warn
